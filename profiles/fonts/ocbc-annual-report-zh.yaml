# Heading fonts of the OCBC annual report template (Chinese editions). Not measured against a reference yet.
name: ocbc-annual-report-zh
version: 1
match:
  fonts_all: [MHeiGB-Bold, Roboto-Medium]
levels:
  - {level: 1, kind: chapter, font: MHeiGB-Bold, size: 20}
  - {level: 2, kind: note, font: MHeiGB-Bold, size: 13}
  - {level: 3, kind: subnote, font: Roboto-Medium, size: 10, numbering: '^\d{1,3}\.\d{1,3}(?:\.\d+)*\s+[^\d\s(]'}
