# Heading fonts of the OCBC annual report template (English editions 2023-2025).
# Measured in docs/docling-eval-v1.md §2 and the font statistics of the six reports.
name: ocbc-annual-report-en
version: 1
match:
  fonts_all: [Geomanist-Medium, Roboto-Bold]     # chosen when the document uses all of these fonts
levels:
  - {level: 1, kind: chapter, font: Geomanist-Medium, size: 20}
  - {level: 2, kind: note, font: Roboto-Bold, size: 13}            # "21. Debt Issued" and unnumbered section titles
  - {level: 3, kind: subnote, font: Roboto-Bold, size: 10, numbering: '^\d{1,3}\.\d{1,3}(?:\.\d+)*\s'}
# Not headings: Roboto-Bold 9pt (infographic labels, in-table titles) and the 24-26pt KPI figures are simply not listed.
