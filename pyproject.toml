[project]
name = "kb-intake"
version = "0.2.0"
description = "Scan files, label their structure with Docling, and write versioned intake packages (contract v1)"
requires-python = "==3.12.*"
dependencies = [
    "docling==2.140.0",
    "docling-core==2.103.0",
    "docling-ibm-models==4.0.3",
    "docling-parse==7.22.3",
    "fastapi==0.128.0",
    "huggingface-hub==1.33.0",
    "jsonschema==4.23.0",
    "packaging==26.3",
    # Upgrading must pass the regression gate (intake-design §9.3): 24 snapshot tables + determinism.
    "pymupdf==1.28.2",
    "python-multipart==0.0.20",
    "pyyaml==6.0.3",
    "uvicorn==0.40.0",
]

[project.scripts]
kb-intake = "kb_intake.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_intake"]
# Ship the contract schemas inside the wheel so `kb-intake check` reads the same copy however it is installed
[tool.hatch.build.targets.wheel.force-include]
"contract" = "kb_intake/contract"
# The pins of the inference dependencies, generated from uv.lock (intake-design §3.2); read at run time by deps.py
"constraints.txt" = "kb_intake/constraints.txt"

[dependency-groups]
dev = [
    "import-linter==2.1",
    "pillow==12.3.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# No imports across repos (D49): kb-intake never imports any kb package
[tool.importlinter]
root_packages = ["kb_intake"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "kb-intake does not import kb"
type = "forbidden"
source_modules = ["kb_intake"]
forbidden_modules = ["pipeline", "service", "profiles", "domains", "scripts", "kb"]
