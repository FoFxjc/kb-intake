name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.2"
      - name: uv.lock is up to date
        run: uv lock --check
      - name: constraints.txt matches uv.lock
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt -o constraints.txt -q
          git diff --exit-code constraints.txt
      - name: No CJK characters outside the design documents
        run: |
          # grep exits 0 on a match, 1 on none, 2 on an error (a missing path, no -P): only 1 passes
          paths=$(ls -d src tests scripts contract README.md AGENTS.md intake.example.yaml 2>/dev/null)
          rc=0; grep -rnP '[\x{3000}-\x{303f}\x{4e00}-\x{9fff}\x{ff00}-\x{ffef}]' $paths || rc=$?
          test "$rc" -eq 1
      - run: uv sync --locked
      - run: uv run lint-imports
      - run: uv run pytest -q
